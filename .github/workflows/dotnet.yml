name: WinUI3 Windows 11 ARM64 Build

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    # Use the native Windows 11 ARM64 runner for optimal speed and native execution
    runs-on: windows-11-arm

    steps:
    - name: Checkout Source Code
      uses: actions/checkout@v4

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 8.0.x

    - name: Setup MSBuild (ARM64 Native)
      uses: microsoft/setup-msbuild@v2
      with:
        msbuild-architecture: arm64

    - name: Restore Dependencies
      run: dotnet restore -r win-arm64

    - name: Build WinUI 3 App
      run: dotnet build SolarSystemWiki/SolarSystemWiki.csproj --configuration Release -r win-arm64 --no-restore /p:Platform=arm64

    - name: Run Tests
      run: dotnet test SolarSystemWiki/SolarSystemWiki.csproj --configuration Release -r win-arm64 --no-build --verbosity normal
